version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:15
    container_name: rizo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rizo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rizodb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: rizo_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: